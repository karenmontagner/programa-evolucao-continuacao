<script>
(async function(){
  var ld=document.getElementById("ld");
  try{
    var b64=document.getElementById("z").textContent.trim();
    var bin=atob(b64), n=bin.length, u=new Uint8Array(n);
    for(var i=0;i<n;i++)u[i]=bin.charCodeAt(i);
    var ds=new DecompressionStream("gzip");
    var w=ds.writable.getWriter(); w.write(u); w.close();
    var rd=ds.readable.getReader(), parts=[], len=0;
    while(true){var r=await rd.read(); if(r.done)break; parts.push(r.value); len+=r.value.length;}
    var out=new Uint8Array(len), off=0;
    parts.forEach(function(p){out.set(p,off); off+=p.length;});
    var html=new TextDecoder("utf-8").decode(out);
    var novo=new DOMParser().parseFromString(html,"text/html");
    document.title=novo.title;
    [].forEach.call(novo.querySelectorAll("style"),function(s){
      var st=document.createElement("style"); st.textContent=s.textContent; document.head.appendChild(st);
    });
    if(ld) ld.remove();
    document.body.innerHTML=novo.body.innerHTML;
    [].forEach.call(novo.querySelectorAll("script"),function(s){
      var n2=document.createElement("script"); n2.textContent=s.textContent; document.body.appendChild(n2);
    });
  }catch(e){ if(ld) ld.textContent="Nao foi possivel carregar: "+e.message; }
})();
</script></body></html>
